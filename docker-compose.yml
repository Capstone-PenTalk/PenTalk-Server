version: "3.9"

services:

  redis:
    image: redis:7
    container_name: pentalk-redis
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: pentalk-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
